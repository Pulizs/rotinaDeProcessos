<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E3A32">
<title>Rotina do escritório · Graziela Engelhardt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5F2; --sheet:#FFFFFF; --ink:#1B2420; --ink-2:#47534D; --muted:#78837D; --line:#E2E6E1; --line-2:#EEF1ED;
  --pine:#2E5A4C; --pine-deep:#1E3A32; --pine-soft:#E5EEE9;
  --ox:#9B2C2C; --ox-soft:#F7E7E5; --amber:#93600F; --amber-soft:#F6EDDA;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
body{overflow-x:hidden}

/* Lateral */
.side{background:var(--pine-deep);color:#DCE7E1;padding:28px 18px 22px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.seal{width:40px;height:40px;border-radius:50%;background:#2A4D43;color:#F1F5F2;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:17px;flex:none}
.brand strong{display:block;color:#fff;font-weight:600;font-size:15px;line-height:1.25}
.brand span{font-size:13px;color:#A9BDB4}
.new{background:#F1F5F2;color:var(--pine-deep);border:0;border-radius:10px;padding:11px 14px;font-weight:600;display:flex;align-items:center;gap:8px;justify-content:center}
.new:hover{background:#fff}
.views{display:flex;flex-direction:column;gap:2px}
.views button{display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:#C9D8D1;padding:9px 10px;border-radius:8px;text-align:left}
.views button:hover{background:rgba(255,255,255,.06);color:#fff}
.views button[aria-current="true"]{background:rgba(255,255,255,.11);color:#fff;font-weight:500}
.views .c{font-size:13px;color:#8FA79C;font-variant-numeric:tabular-nums}
.views .c.alert{color:#fff;background:var(--ox);border-radius:999px;padding:0 8px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid rgba(255,255,255,.1);padding-top:14px}
.side-foot button{background:none;border:0;color:#A9BDB4;text-align:left;padding:7px 10px;border-radius:8px;font-size:14px}
.side-foot button:hover{color:#fff;background:rgba(255,255,255,.06)}
.side-foot small{color:#7F978C;font-size:12px;padding:6px 10px 0;line-height:1.4}

/* Principal */
main{padding:40px 48px 80px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px;max-width:960px}
.top h1{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.05;margin:0;letter-spacing:-.5px}
.top p{margin:8px 0 0;color:var(--ink-2);max-width:60ch}
.top p b{font-weight:600;color:var(--ink)}
.top p .late{color:var(--ox);font-weight:600}
.tools{display:flex;gap:8px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:260px;padding:9px 12px 9px 34px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;outline:none}
.search input:focus{border-color:var(--pine)}
.tools select{padding:9px 10px;border:1px solid var(--line);background:var(--sheet);border-radius:10px}

.groups{max-width:960px;display:flex;flex-direction:column;gap:30px}
.group h2{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.2}
.group h2 .d{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:400}
.group h2 .n{margin-left:auto;font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:400}
.group.late h2{color:var(--ox)}
.group.today h2{color:var(--amber)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.group.late .sheet{border-color:#EBCFCB}

.row{display:grid;grid-template-columns:28px 1fr auto;gap:14px;padding:14px 18px 14px 14px;border-top:1px solid var(--line-2);cursor:pointer;align-items:start}
.row:first-child{border-top:0}
.row:hover{background:#FAFBF9}
.check{width:22px;height:22px;margin-top:1px;border-radius:50%;border:1.5px solid #B8C2BC;background:#fff;display:grid;place-items:center;padding:0;color:transparent}
.check:hover{border-color:var(--pine);color:var(--pine)}
.row.done .check{background:var(--pine);border-color:var(--pine);color:#fff}
.row.done .name,.row.done .todo{color:var(--muted)}
.row.done .todo{text-decoration:line-through;text-decoration-color:#C3CBC6}
.l1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.name{font-weight:600;font-size:15.5px}
.acao{color:var(--ink-2);font-size:14px}
.todo{margin:3px 0 0;font-size:15px;color:var(--ink)}
.and{margin:4px 0 0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--line-2);color:var(--ink-2)}
.tag.jud{background:var(--pine-soft);color:var(--pine)}
.tag.wait{background:var(--amber-soft);color:var(--amber)}
.tag.prazo{background:var(--ox-soft);color:var(--ox);font-weight:500}
.tag.miss{background:none;border:1px dashed #CBD3CE;color:var(--muted)}
.right{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums}
.right.late{color:var(--ox);font-weight:500}

.empty{background:var(--sheet);border:1px dashed #CCD4CF;border-radius:12px;padding:48px 24px;text-align:center;color:var(--ink-2)}
.empty h2{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 6px;color:var(--ink)}
.empty .acts{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sheet);padding:9px 14px;border-radius:10px;font-weight:500}
.btn:hover{background:var(--paper)}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.pri:hover{background:var(--pine-deep)}
.btn.del{color:var(--ox);border-color:transparent;background:none;padding-left:4px}
.btn.del:hover{background:var(--ox-soft)}

/* Painel */
.scrim{position:fixed;inset:0;background:rgba(20,32,27,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--sheet);z-index:21;transform:translateX(100%);transition:transform .25s ease,visibility 0s linear .25s;visibility:hidden;display:flex;flex-direction:column}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{transform:none;visibility:visible;transition:transform .25s ease;box-shadow:-12px 0 40px rgba(20,32,27,.12)}
.d-head{padding:22px 24px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.d-head h2{margin:0;font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.15}
.d-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.x{border:0;background:none;width:36px;height:36px;border-radius:8px;font-size:22px;color:var(--muted);flex:none}
.x:hover{background:var(--paper)}
.d-body{padding:18px 24px;overflow:auto;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px 14px;align-content:start}
.full{grid-column:1/-1}
.fl{min-width:0;display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:500}
.fl input,.fl select,.fl textarea{width:100%;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:15px;font-weight:400;color:var(--ink);outline:none}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--pine)}
.fl textarea{resize:vertical;min-height:84px;line-height:1.45}
.fl.todo-f textarea{background:#FBFCFA}
.sec{grid-column:1/-1;font-family:var(--serif);font-size:18px;font-weight:500;margin:8px 0 -4px;color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:400;color:var(--ink-2)}
.quick button:hover{border-color:var(--pine);color:var(--pine)}
.note{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin:0;font-weight:400}
.d-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 24px;border-top:1px solid var(--line)}
.d-foot .r{display:flex;gap:8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 12px 10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:40;display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:#B9E0CF;font-weight:600;padding:2px 6px}

/* Celular */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{position:static;height:auto;padding:16px 16px 10px;gap:14px}
  .side-foot{display:none}
  .brand-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .new{padding:9px 12px}
  .views{flex-direction:row;overflow-x:auto;gap:4px;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .views button{flex:none;gap:8px}
  main{padding:24px 16px 80px}
  .top h1{font-size:34px}
  .tools{width:100%}
  .search{flex:1}.search input{width:100%}
  .row{grid-template-columns:26px 1fr;padding:13px 14px 13px 12px}
  .right{grid-column:2;text-align:left;padding:0}
  .d-body{grid-template-columns:1fr}
  .mobile-more{display:flex!important}
}
.mobile-more{display:none;gap:8px;flex-wrap:wrap;margin-top:28px}
@media (min-width:901px){.brand-row{display:contents}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  .app{display:block}
  .side,.tools,.check,.mobile-more,.toast{display:none!important}
  main{padding:0}
  .top h1{font-size:28px}
  .row{break-inside:avoid;padding:8px 10px;grid-template-columns:1fr auto}
  .sheet{border-color:#ccc}
  .group{break-inside:auto}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand-row">
      <div class="brand">
        <div class="seal" aria-hidden="true">GE</div>
        <div><strong>Graziela Engelhardt</strong><span>Rotina do escritório</span></div>
      </div>
      <button class="new" data-m="novo"><span aria-hidden="true">+</span> Novo cliente</button>
    </div>
    <nav class="views" id="views" aria-label="Visões"></nav>
    <div class="side-foot">
      <button data-m="export">Baixar backup</button>
      <button data-m="import">Importar backup</button>
      <button data-m="print">Imprimir esta lista</button>
      <small>Os dados ficam salvos só neste navegador.</small>
    </div>
  </aside>

  <main>
    <header class="top">
      <div>
        <h1 id="title">Agenda</h1>
        <p id="sub"></p>
      </div>
      <div class="tools">
        <label class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Buscar cliente ou processo" aria-label="Buscar">
        </label>
        <select id="nat" aria-label="Filtrar por natureza">
          <option value="">Todas</option>
          <option value="Judicial">Judiciais</option>
          <option value="Extrajudicial">Extrajudiciais</option>
          <option value="-">Sem definição</option>
        </select>
      </div>
    </header>
    <div class="groups" id="groups"></div>
    <div class="mobile-more">
      <button class="btn" data-m="export">Baixar backup</button>
      <button class="btn" data-m="import">Importar backup</button>
    </div>
  </main>
</div>

<div class="scrim" data-close></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="dTitle">
  <form id="form" style="display:contents" novalidate>
    <div class="d-head">
      <div><h2 id="dTitle">Cliente</h2><p id="dSub"></p></div>
      <button type="button" class="x" data-close aria-label="Fechar">×</button>
    </div>
    <div class="d-body">
      <label class="fl full">Nome do cliente<input name="nome" autocomplete="off"></label>
      <label class="fl todo-f full">O que tem que ser feito<textarea name="aFazer" placeholder="Próxima providência"></textarea></label>
      <label class="fl full">Andamento<textarea name="andamento" placeholder="O que aconteceu por último"></textarea></label>
      <label class="fl">Verificar de novo em<input type="date" name="verificar">
        <span class="quick">
          <button type="button" data-set="verificar" data-d="1">Amanhã</button>
          <button type="button" data-set="verificar" data-d="7">1 semana</button>
          <button type="button" data-set="verificar" data-d="15">15 dias</button>
          <button type="button" data-set="verificar" data-d="30">30 dias</button>
        </span>
      </label>
      <label class="fl">Último andamento em<input type="date" name="ultimo">
        <span class="quick"><button type="button" data-set="ultimo" data-d="0">Hoje</button></span>
      </label>
      <label class="fl">Prazo ou audiência<input type="date" name="prazo"></label>
      <label class="fl">Situação
        <select name="status"><option>Pendente</option><option>Aguardando</option><option>Concluído</option></select>
      </label>
      <p class="sec">Processo</p>
      <label class="fl">Tipo de ação<input name="acao" placeholder="Ex.: Alimentos"></label>
      <label class="fl">Número do processo<input name="processo" inputmode="numeric" placeholder="0000000-00.0000.0.00.0000"></label>
      <label class="fl">Judicial ou extrajudicial
        <select name="natureza"><option value="">A definir</option><option>Judicial</option><option>Extrajudicial</option></select>
      </label>
      <label class="fl">Parceria dividida
        <select name="parceria"><option value="">Não informado</option><option>Sim</option><option>Não</option></select>
      </label>
      <label class="fl full">Parceria com<input name="parceiro" placeholder="Nome de quem divide o caso"></label>
      <p class="note">Ao mudar o andamento, a data do último andamento vira hoje automaticamente.</p>
    </div>
    <div class="d-foot">
      <button type="button" class="btn del" id="del">Excluir cliente</button>
      <div class="r">
        <button type="button" class="btn" data-close>Cancelar</button>
        <button type="submit" class="btn pri">Salvar</button>
      </div>
    </div>
  </form>
</aside>

<input type="file" id="file" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undo" hidden>Desfazer</button></div>

<script>
(function(){
const KEY='rotina-graziela-v1';
const FIELDS=['nome','acao','processo','natureza','parceria','parceiro','andamento','aFazer','ultimo','verificar','prazo','status'];
let clientes=[], view='agenda', busca='', natureza='', editId=null, undoFn=null;

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>iso(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=s=>s?Math.round((parse(s)-parse(hoje()))/864e5):null;
const curto=s=>{if(!s)return '';const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+(d.getFullYear()!==new Date().getFullYear()?'/'+d.getFullYear():'')};
const longo=(s,o)=>parse(s).toLocaleDateString('pt-BR',o||{day:'numeric',month:'long'});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'c'+Date.now()+Math.random().toString(16).slice(2);
const done=c=>c.status==='Concluído';
const plural=(n,s,p)=>n+' '+(n===1?s:p);

function load(){try{const r=localStorage.getItem(KEY);clientes=r?JSON.parse(r):[]}catch(e){clientes=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(clientes))}catch(e){toast('Não foi possível salvar. Verifique se o navegador permite armazenamento.')}}
function toast(msg,undo){
  const t=$('#toast');$('#toastMsg').textContent=msg;undoFn=undo||null;$('#undo').hidden=!undo;
  t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),undo?5000:2600);
}
$('#undo').addEventListener('click',()=>{if(undoFn){undoFn();undoFn=null;save();render()}$('#toast').classList.remove('show')});

const VIEWS={
  agenda:{nome:'Agenda',filtro:c=>!done(c),agrupa:'verificar'},
  prazos:{nome:'Prazos e audiências',filtro:c=>!done(c)&&!!c.prazo,agrupa:'prazo'},
  aguardando:{nome:'Aguardando',filtro:c=>c.status==='Aguardando',agrupa:'verificar'},
  concluidos:{nome:'Concluídos',filtro:done,agrupa:'letra'},
  todos:{nome:'Todos os clientes',filtro:()=>true,agrupa:'letra'}
};
const atrasados=()=>clientes.filter(c=>!done(c)&&c.verificar&&diff(c.verificar)<0).length;
const deHoje=()=>clientes.filter(c=>!done(c)&&diff(c.verificar)===0).length;

function renderViews(){
  $('#views').innerHTML=Object.entries(VIEWS).map(([k,v])=>{
    const n=clientes.filter(v.filtro).length, late=k==='agenda'?atrasados():0;
    return '<button data-v="'+k+'" aria-current="'+(view===k)+'"><span>'+v.nome+'</span><span class="c'+(late?' alert':'')+'" title="'+(late?plural(late,'atrasado','atrasados'):'')+'">'+(late||n)+'</span></button>';
  }).join('');
}

function renderTop(){
  $('#title').textContent=VIEWS[view].nome;
  const data=cap(new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}));
  let s='';
  if(view==='agenda'){
    const h=deHoje(), l=atrasados();
    s=data+'. '+(h?'<b>'+plural(h,'cliente','clientes')+'</b> para verificar hoje':'Nada para verificar hoje')+(l?', <span class="late">'+plural(l,'atrasado','atrasados')+'</span>.':'.');
  }else if(view==='prazos') s='Prazos fatais e audiências dos casos em aberto, do mais próximo ao mais distante.';
  else if(view==='aguardando') s='Casos parados à espera de despacho, do MP ou de outra parte.';
  else if(view==='concluidos') s='Casos encerrados. Para reabrir, desmarque o círculo.';
  else s=plural(clientes.length,'cliente cadastrado','clientes cadastrados')+', em ordem alfabética.';
  $('#sub').innerHTML=s;
}

function grupoData(s,key){
  if(!s)return {k:'~',t:'Sem data',d:''};
  const n=diff(s);
  if(n<0)return {k:'0',t:key==='prazo'?'Vencidos':'Atrasados',d:'',tone:'late'};
  if(n===0)return {k:'1'+s,t:'Hoje',d:longo(s),tone:'today'};
  if(n===1)return {k:'1'+s,t:'Amanhã',d:longo(s)};
  if(n<=13)return {k:'1'+s,t:cap(longo(s,{weekday:'long'})),d:longo(s)};
  const d=parse(s);
  return {k:'2'+s.slice(0,7),t:cap(d.toLocaleDateString('pt-BR',{month:'long'}))+(d.getFullYear()!==new Date().getFullYear()?' de '+d.getFullYear():''),d:''};
}

function linha(c,key){
  const tags=[];
  if(c.natureza==='Judicial')tags.push('<span class="tag jud">Judicial</span>');
  else if(c.natureza==='Extrajudicial')tags.push('<span class="tag">Extrajudicial</span>');
  if(c.parceria==='Sim')tags.push('<span class="tag">Parceria'+(c.parceiro?' com '+esc(c.parceiro):'')+'</span>');
  if(c.status==='Aguardando'&&view!=='aguardando')tags.push('<span class="tag wait">Aguardando</span>');
  if(c.prazo&&!done(c)&&key!=='prazo')tags.push('<span class="tag prazo">Prazo '+curto(c.prazo)+'</span>');
  if(c.processo)tags.push('<span class="tag">Proc. '+esc(c.processo)+'</span>');
  let right='',rc='';
  const n=diff(c[key==='letra'?'verificar':key]);
  if(key==='letra'){right=done(c)?'':(c.verificar?'Verificar '+curto(c.verificar):'')}
  else if(n!==null&&n<0){right=(n===-1?'ontem':'há '+(-n)+' dias');rc=' late'}
  else if(n!==null&&n>13){right=curto(c[key])}
  if(key==='prazo'&&c.verificar)right=(right?right+'<br>':'')+'<span style="color:var(--muted);font-weight:400">verificar '+curto(c.verificar)+'</span>';
  return '<div class="row'+(done(c)?' done':'')+'" data-id="'+esc(c.id)+'" tabindex="0" role="button" aria-label="Abrir '+esc(c.nome)+'">'+
    '<button class="check" data-a="check" aria-label="'+(done(c)?'Reabrir':'Concluir')+' '+esc(c.nome)+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>'+
    '<div><div class="l1"><span class="name">'+esc(c.nome)+'</span>'+(c.acao?'<span class="acao">'+esc(c.acao)+'</span>':'')+'</div>'+
    '<p class="todo">'+(esc(c.aFazer)||'<span style="color:var(--muted)">Sem providência definida</span>')+'</p>'+
    (c.andamento?'<p class="and">'+esc(c.andamento)+'</p>':'')+
    (tags.length?'<div class="tags">'+tags.join('')+'</div>':'')+'</div>'+
    '<div class="right'+rc+'">'+right+'</div></div>';
}

function renderGroups(){
  const el=$('#groups');
  if(!clientes.length){
    el.innerHTML='<div class="empty"><h2>Comece importando seus clientes</h2><p>Escolha o arquivo clientes.json ou um backup baixado deste site.</p><div class="acts"><button class="btn pri" data-m="import">Importar arquivo</button><button class="btn" data-m="novo">Cadastrar cliente</button></div></div>';
    return;
  }
  const v=VIEWS[view], q=norm(busca);
  let arr=clientes.filter(v.filtro).filter(c=>{
    if(natureza==='-'){if(c.natureza==='Judicial'||c.natureza==='Extrajudicial')return false}
    else if(natureza&&c.natureza!==natureza)return false;
    return !q||norm([c.nome,c.acao,c.processo,c.andamento,c.aFazer,c.parceiro].join(' ')).includes(q);
  });
  if(!arr.length){
    el.innerHTML='<div class="empty"><h2>'+(q||natureza?'Nenhum cliente encontrado':'Nada por aqui')+'</h2><p>'+(q||natureza?'Tente outra busca ou limpe o filtro.':'Quando houver casos nesta visão, eles aparecem aqui.')+'</p></div>';
    return;
  }
  const key=v.agrupa, groups=new Map();
  const nomeCmp=(a,b)=>norm(a.nome).localeCompare(norm(b.nome));
  if(key==='letra'){
    arr.sort(nomeCmp);
    arr.forEach(c=>{const L=(norm(c.nome).charAt(0)||'#').toUpperCase();if(!groups.has(L))groups.set(L,{t:L,d:'',items:[]});groups.get(L).items.push(c)});
  }else{
    arr.sort((a,b)=>(a[key]||'9999').localeCompare(b[key]||'9999')||nomeCmp(a,b));
    arr.forEach(c=>{const g=grupoData(c[key],key);if(!groups.has(g.k))groups.set(g.k,Object.assign(g,{items:[]}));groups.get(g.k).items.push(c)});
  }
  const ordem=[...groups.keys()].sort();
  el.innerHTML=ordem.map(k=>{const g=groups.get(k);
    return '<section class="group'+(g.tone?' '+g.tone:'')+'"><h2>'+esc(g.t)+(g.d?'<span class="d">'+esc(g.d)+'</span>':'')+'<span class="n">'+plural(g.items.length,'cliente','clientes')+'</span></h2><div class="sheet">'+g.items.map(c=>linha(c,key)).join('')+'</div></section>';
  }).join('');
}

function render(){renderViews();renderTop();renderGroups()}

/* Painel lateral */
const form=$('#form');
function abrir(id){
  editId=id;
  const c=id?clientes.find(x=>x.id===id):{status:'Pendente',ultimo:hoje(),verificar:addDays(hoje(),7)};
  FIELDS.forEach(k=>form.elements[k].value=c[k]||'');
  if(!c.status)form.elements.status.value='Pendente';
  $('#dTitle').textContent=id?c.nome:'Novo cliente';
  $('#dSub').textContent=id?(c.ultimo?'Último andamento em '+longo(c.ultimo,{day:'numeric',month:'long',year:'numeric'}):'Sem andamento registrado'):'Preencha o que souber. O resto pode ficar para depois.';
  $('#del').style.visibility=id?'visible':'hidden';
  document.body.classList.add('open');$('#drawer').setAttribute('aria-hidden','false');
  setTimeout(()=>form.elements[id?'aFazer':'nome'].focus(),180);
}
function fechar(){document.body.classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');editId=null}
form.addEventListener('submit',e=>{
  e.preventDefault();
  const v={};FIELDS.forEach(k=>v[k]=form.elements[k].value.trim());
  if(!v.nome){form.elements.nome.focus();toast('Informe o nome do cliente para salvar.');return}
  if(editId){
    const c=clientes.find(x=>x.id===editId);
    if(v.andamento!==(c.andamento||'')&&v.ultimo===(c.ultimo||''))v.ultimo=hoje();
    Object.assign(c,v);toast('Alterações salvas');
  }else{clientes.push(Object.assign({id:uid()},v));toast('Cliente cadastrado')}
  save();fechar();render();
});
document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){fechar();return}
  const q=e.target.closest('[data-set]');if(q){form.elements[q.dataset.set].value=addDays(hoje(),+q.dataset.d);return}
  const m=e.target.closest('[data-m]');if(m){acao(m.dataset.m);return}
  const vb=e.target.closest('[data-v]');if(vb){view=vb.dataset.v;render();window.scrollTo(0,0);return}
  const ck=e.target.closest('[data-a="check"]');
  if(ck){
    const c=clientes.find(x=>x.id===ck.closest('.row').dataset.id), antes=c.status;
    c.status=done(c)?'Pendente':'Concluído';save();render();
    toast(done(c)?c.nome+' concluído':c.nome+' reaberto',()=>{c.status=antes});return;
  }
  const row=e.target.closest('.row');if(row)abrir(row.dataset.id);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.body.classList.contains('open'))fechar();
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('row')){e.preventDefault();abrir(e.target.dataset.id)}
});
$('#del').addEventListener('click',()=>{
  const i=clientes.findIndex(x=>x.id===editId);if(i<0)return;
  const c=clientes[i];
  clientes.splice(i,1);save();fechar();render();
  toast(c.nome+' excluído',()=>clientes.splice(i,0,c));
});
$('#q').addEventListener('input',e=>{busca=e.target.value;renderGroups()});
$('#nat').addEventListener('change',e=>{natureza=e.target.value;renderGroups()});

function acao(m){
  if(m==='novo')abrir(null);
  if(m==='print')window.print();
  if(m==='import')$('#file').click();
  if(m==='export'){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(clientes,null,2)],{type:'application/json'}));
    a.download='rotina-backup-'+hoje()+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup baixado');
  }
}
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      let data=JSON.parse(r.result);if(!Array.isArray(data))data=data&&data.clientes;
      if(!Array.isArray(data))throw 0;
      if(clientes.length&&!confirm('Substituir os '+clientes.length+' clientes atuais pelos '+data.length+' do arquivo?'))return;
      clientes=data.map(c=>Object.assign({status:'Pendente'},c,{id:c.id||uid()}));
      save();view='agenda';render();toast(plural(data.length,'cliente importado','clientes importados'));
    }catch(err){toast('Esse arquivo não é um backup válido. Use o clientes.json ou um backup baixado daqui.')}
    finally{e.target.value=''}
  };
  r.readAsText(f);
});

load();render();
})();
</script>
