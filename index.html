<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rotina · Graziela Engelhardt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ed; --card:#fffdf9; --ink:#1d2733; --muted:#6b7280; --line:#e8e1d4;
  --navy:#1f3a5c; --navy-2:#2b4c74; --gold:#b08d57; --gold-soft:#f4ecdd;
  --red:#b42318; --red-soft:#fdeceb; --amber:#a15c07; --amber-soft:#fdf3e1;
  --green:#2f6f4f; --green-soft:#e6f2eb; --blue-soft:#e9eff7; --violet-soft:#efeaf6; --violet:#5b4a86;
  --radius:16px; --shadow:0 1px 2px rgba(29,39,51,.04),0 6px 20px rgba(29,39,51,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* Header */
header{background:var(--navy);color:#fff;padding:28px 0 76px;position:relative}
header::after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
.brand{display:flex;align-items:center;gap:16px}
.mono{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600;color:var(--gold);letter-spacing:1px;flex:none}
.brand h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:30px;letter-spacing:.3px;line-height:1.1}
.brand small{display:block;color:#c9d4e3;font-size:12.5px;letter-spacing:2.5px;text-transform:uppercase;margin-top:4px}
.greet{margin-top:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.greet p{margin:0;color:#dfe6f0;font-size:15.5px}
.greet p b{color:#fff;font-weight:600}
.greet .date{color:var(--gold);font-size:13px;letter-spacing:.5px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:-48px;position:relative}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .15s,border-color .15s}
.stat:hover{transform:translateY(-2px)}
.stat.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset,var(--shadow)}
.stat .n{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;font-weight:700;line-height:1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.s-late .n{color:var(--red)} .s-late .dot{background:var(--red)}
.s-today .n{color:var(--amber)} .s-today .dot{background:var(--amber)}
.s-week .n{color:var(--navy)} .s-week .dot{background:var(--navy)}
.s-prazo .n{color:var(--violet)} .s-prazo .dot{background:var(--violet)}
.s-wait .n{color:var(--gold)} .s-wait .dot{background:var(--gold)}

/* Toolbar */
.toolbar{display:flex;gap:10px;align-items:center;margin:22px 0 10px;flex-wrap:wrap}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none}
.search input:focus{border-color:var(--navy-2)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
select.f{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s}
.btn:hover{background:#f1ece2}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.danger{color:var(--red)}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:210px;display:none;z-index:5}
.menu.open .menu-list{display:block}
.menu-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer}
.menu-list button:hover{background:var(--gold-soft)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.tab{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:13.5px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
.tab .c{opacity:.6;margin-left:4px;font-weight:500}

/* Cards */
.list{display:flex;flex-direction:column;gap:12px;padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px 14px 22px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.u-late::before{background:var(--red)} .u-today::before{background:var(--amber)} .u-week::before{background:var(--navy)}
.u-later::before{background:var(--gold)} .u-done{opacity:.62} .u-done::before{background:var(--green)}
.card-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.card h3{margin:0 0 6px;font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;font-weight:600;line-height:1.15}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--navy);font-weight:500}
.chip.jud{background:var(--navy);color:#fff}
.chip.ext{background:var(--gold-soft);color:#7a5a26}
.chip.ind{background:#f1efe9;color:var(--muted)}
.chip.par{background:var(--violet-soft);color:var(--violet)}
.chip.wait{background:var(--amber-soft);color:var(--amber)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.when{text-align:right;flex:none;padding:8px 12px;border-radius:12px;background:#f7f4ee;min-width:150px}
.when .wl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.when strong{display:block;font-size:14.5px;text-transform:capitalize}
.when .wr{font-size:12.5px;color:var(--muted)}
.u-late .when{background:var(--red-soft)} .u-late .when .wr,.u-late .when strong{color:var(--red)}
.u-today .when{background:var(--amber-soft)} .u-today .when .wr,.u-today .when strong{color:var(--amber)}
.card-body{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 12px}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:3px}
.card-body p{margin:0;white-space:pre-line}
.todo{background:var(--gold-soft);border-radius:12px;padding:10px 12px}
.todo p{font-weight:500}
.card-foot{display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.card-foot b{color:var(--ink);font-weight:500}
.prazo{color:var(--violet)} .prazo b{color:var(--violet)}
.prazo.hot{color:var(--red);font-weight:600} .prazo.hot b{color:var(--red)}
.actions{margin-left:auto;display:flex;gap:6px}
.actions button{border:1px solid var(--line);background:#fff;padding:6px 11px;border-radius:10px;cursor:pointer;font-size:13px}
.actions button:hover{background:#f1ece2}
.actions .ed{background:var(--navy);color:#fff;border-color:var(--navy)}
.actions .ed:hover{background:var(--navy-2)}

.empty{text-align:center;padding:56px 20px;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted)}
.empty h2{font-family:"Cormorant Garamond",Georgia,serif;color:var(--ink);font-weight:600;margin:0 0 6px;font-size:26px}
.empty .row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}

/* Modal */
dialog{border:0;border-radius:20px;padding:0;width:min(680px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.25);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(20,30,45,.45);backdrop-filter:blur(2px)}
.m-head{padding:20px 24px 4px;display:flex;justify-content:space-between;align-items:center}
.m-head h2{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:26px}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
form .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:12px 24px 4px}
.full{grid-column:1/-1}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
label.fl input,label.fl select,label.fl textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:14.5px;outline:none}
label.fl input:focus,label.fl select:focus,label.fl textarea:focus{border-color:var(--navy-2)}
label.fl textarea{resize:vertical;min-height:72px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.quick button:hover{background:var(--gold-soft)}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0}
.m-foot{display:flex;justify-content:space-between;gap:10px;padding:16px 24px 20px;border-top:1px solid var(--line);margin-top:12px}
.m-foot .r{display:flex;gap:8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:0 0 30px}

@media (max-width:820px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .card-body{grid-template-columns:1fr}
}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:last-child{grid-column:1/-1}
  .card-top{flex-direction:column}
  .when{text-align:left;width:100%}
  .actions{margin-left:0;width:100%}
  .actions button{flex:1}
  form .grid{grid-template-columns:1fr}
  .brand h1{font-size:25px}
}
@media print{
  body{background:#fff;font-size:12px}
  header{background:#fff;color:#000;padding:0 0 10px}
  header::after,.stats,.toolbar,.tabs,.actions,footer,.greet p{display:none}
  .brand small{color:#555} .mono{border-color:#000;color:#000}
  .card{box-shadow:none;break-inside:avoid;padding:10px 12px;border-color:#ccc}
  .list{gap:6px}
  .todo{background:#f3f3f3}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <div class="mono">GE</div>
      <div>
        <h1>Graziela Engelhardt</h1>
        <small>Advocacia · Rotina de processos</small>
      </div>
    </div>
    <div class="greet">
      <p id="greet"></p>
      <span class="date" id="today"></span>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="stats" id="stats"></section>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar cliente, ação, processo ou tarefa…">
    </div>
    <select class="f" id="nat">
      <option value="">Judicial e extrajudicial</option>
      <option value="Judicial">Só judicial</option>
      <option value="Extrajudicial">Só extrajudicial</option>
      <option value="-">A definir</option>
    </select>
    <button class="btn primary" id="novo">+ Novo cliente</button>
    <div class="menu" id="menu">
      <button class="btn" id="menuBtn" aria-label="Mais opções">⋯</button>
      <div class="menu-list">
        <button data-m="export">Baixar backup (.json)</button>
        <button data-m="import">Importar arquivo (.json)</button>
        <button data-m="print">Imprimir lista</button>
      </div>
    </div>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <section class="list" id="list"></section>
</main>

<footer>Os dados ficam salvos apenas neste navegador. Baixe um backup de vez em quando.</footer>

<input type="file" id="file" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <div class="m-head">
      <h2 id="dlgTitle">Editar cliente</h2>
      <button type="button" class="x" data-close aria-label="Fechar">×</button>
    </div>
    <div class="grid">
      <label class="fl">Nome do cliente<input name="nome" required></label>
      <label class="fl">Tipo de ação<input name="acao" placeholder="Ex.: Alimentos, Execução…"></label>
      <label class="fl">Número do processo<input name="processo" placeholder="0000000-00.0000.0.00.0000"></label>
      <label class="fl">Judicial ou extrajudicial
        <select name="natureza"><option value="">A definir</option><option>Judicial</option><option>Extrajudicial</option></select>
      </label>
      <label class="fl">Parceria dividida?
        <select name="parceria"><option value="">Não informado</option><option>Sim</option><option>Não</option></select>
      </label>
      <label class="fl">Parceria com<input name="parceiro" placeholder="Nome do(a) parceiro(a)"></label>
      <label class="fl full">Andamento<textarea name="andamento" placeholder="O que aconteceu por último no processo"></textarea></label>
      <label class="fl full">O que tem que ser feito<textarea name="aFazer" placeholder="Próxima providência"></textarea></label>
      <label class="fl">Data do último andamento<input type="date" name="ultimo">
        <span class="quick"><button type="button" data-set="ultimo" data-d="0">Hoje</button></span>
      </label>
      <label class="fl">Verificar novamente em<input type="date" name="verificar">
        <span class="quick">
          <button type="button" data-set="verificar" data-d="1">Amanhã</button>
          <button type="button" data-set="verificar" data-d="7">+1 semana</button>
          <button type="button" data-set="verificar" data-d="15">+15 dias</button>
          <button type="button" data-set="verificar" data-d="30">+30 dias</button>
        </span>
      </label>
      <label class="fl">Prazo fatal / audiência (opcional)<input type="date" name="prazo"></label>
      <label class="fl">Situação
        <select name="status"><option>Pendente</option><option>Aguardando</option><option>Concluído</option></select>
      </label>
      <p class="hint full">Dica: ao mudar o “Andamento”, a data do último andamento passa a ser hoje automaticamente.</p>
    </div>
    <div class="m-foot">
      <button type="button" class="btn danger" id="del">Excluir</button>
      <div class="r">
        <button type="button" class="btn" data-close>Cancelar</button>
        <button type="submit" class="btn primary">Salvar</button>
      </div>
    </div>
  </form>
</dialog>

<script>
(function(){
const KEY='rotina-graziela-v1';
let clientes=[], filtro='ativos', busca='', natureza='', editId=null;

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>isoDate(new Date());
const parse=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(iso,n)=>{const d=parse(iso);d.setDate(d.getDate()+n);return isoDate(d)};
const diffDays=iso=>iso?Math.round((parse(iso)-parse(hoje()))/86400000):null;
const DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
const fmt=(iso,dia)=>{if(!iso)return '—';const d=parse(iso);const s=pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();return dia?DIAS[d.getDay()]+', '+s:s};
const rel=n=>n===null?'':n===0?'hoje':n===1?'amanhã':n===-1?'ontem':n>0?'em '+n+' dias':'há '+(-n)+' dias';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'c'+Date.now()+Math.random().toString(16).slice(2);

function load(){try{const r=localStorage.getItem(KEY);clientes=r?JSON.parse(r):[]}catch(e){clientes=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(clientes))}catch(e){toast('Não foi possível salvar neste navegador')}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)}

const done=c=>c.status==='Concluído';
function urg(c){if(done(c))return 'done';const n=diffDays(c.verificar);if(n===null)return 'none';if(n<0)return 'late';if(n===0)return 'today';if(n<=7)return 'week';return 'later'}

const FILTROS={
  ativos:{nome:'Em aberto',f:c=>!done(c)},
  late:{nome:'Atrasados',f:c=>urg(c)==='late'},
  today:{nome:'Hoje',f:c=>urg(c)==='today'},
  week:{nome:'Próximos 7 dias',f:c=>!done(c)&&diffDays(c.verificar)!==null&&diffDays(c.verificar)>=0&&diffDays(c.verificar)<=7},
  prazo:{nome:'Prazos e audiências',f:c=>!done(c)&&!!c.prazo},
  wait:{nome:'Aguardando',f:c=>c.status==='Aguardando'},
  done:{nome:'Concluídos',f:done},
  todos:{nome:'Todos',f:()=>true}
};

function renderHeader(){
  const h=new Date().getHours();
  const sauda=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const nl=clientes.filter(c=>urg(c)==='late').length, nh=clientes.filter(c=>urg(c)==='today').length;
  let txt=sauda+', Graziela. ';
  if(!clientes.length) txt+='Vamos organizar seus clientes?';
  else if(!nl&&!nh) txt+='Nada para verificar hoje.';
  else txt+='Hoje: <b>'+nh+'</b> para verificar'+(nl?' e <b>'+nl+'</b> atrasado'+(nl>1?'s':''):'')+'.';
  $('#greet').innerHTML=txt;
  const dt=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#today').textContent=dt.charAt(0).toUpperCase()+dt.slice(1);
}

function renderStats(){
  const items=[['late','Atrasados','s-late'],['today','Para hoje','s-today'],['week','Próximos 7 dias','s-week'],['prazo','Prazos e audiências','s-prazo'],['wait','Aguardando','s-wait']];
  $('#stats').innerHTML=items.map(([k,l,cls])=>'<button class="stat '+cls+(filtro===k?' on':'')+'" data-f="'+k+'"><div class="n">'+clientes.filter(FILTROS[k].f).length+'</div><div class="l"><span class="dot"></span>'+l+'</div></button>').join('');
  $('#tabs').innerHTML=['ativos','late','today','week','prazo','wait','done','todos'].map(k=>'<button class="tab'+(filtro===k?' on':'')+'" data-f="'+k+'">'+FILTROS[k].nome+'<span class="c">'+clientes.filter(FILTROS[k].f).length+'</span></button>').join('');
}

function card(c){
  const u=urg(c), n=diffDays(c.verificar), np=diffDays(c.prazo);
  const nat=c.natureza==='Judicial'?'<span class="chip jud">Judicial</span>':c.natureza==='Extrajudicial'?'<span class="chip ext">Extrajudicial</span>':'<span class="chip ind">Judicial/extra: a definir</span>';
  const par=c.parceria==='Sim'?'<span class="chip par">Parceria'+(c.parceiro?' · '+esc(c.parceiro):'')+'</span>':c.parceria==='Não'?'<span class="chip ind">Sem parceria</span>':'';
  const st=c.status==='Aguardando'?'<span class="chip wait">Aguardando</span>':done(c)?'<span class="chip ok">Concluído</span>':'';
  return '<article class="card u-'+u+'" data-id="'+esc(c.id)+'">'+
    '<div class="card-top"><div><h3>'+esc(c.nome)+'</h3><div class="chips">'+(c.acao?'<span class="chip">'+esc(c.acao)+'</span>':'')+nat+par+st+'</div></div>'+
    '<div class="when"><span class="wl">Verificar</span><strong>'+(c.verificar?fmt(c.verificar,true):'Sem data')+'</strong><span class="wr">'+rel(n)+'</span></div></div>'+
    '<div class="card-body"><div><span class="lbl">Andamento</span><p>'+(esc(c.andamento)||'—')+'</p></div>'+
    '<div class="todo"><span class="lbl">O que fazer</span><p>'+(esc(c.aFazer)||'—')+'</p></div></div>'+
    '<div class="card-foot"><span>Processo nº <b>'+(esc(c.processo)||'—')+'</b></span><span>Último andamento <b>'+fmt(c.ultimo)+'</b></span>'+
    (c.prazo?'<span class="prazo'+(np!==null&&np<=3&&!done(c)?' hot':'')+'">Prazo/audiência <b>'+fmt(c.prazo)+'</b>'+(done(c)?'':' · '+rel(np))+'</span>':'')+
    '<div class="actions">'+(done(c)?'':'<button data-a="adiar" title="Adiar a verificação em 7 dias">+7 dias</button>')+
    '<button data-a="concluir">'+(done(c)?'Reabrir':'Concluir')+'</button><button class="ed" data-a="editar">Editar</button></div></div></article>';
}

function renderList(){
  const q=norm(busca);
  let arr=clientes.filter(FILTROS[filtro].f).filter(c=>{
    if(natureza==='-'?(c.natureza==='Judicial'||c.natureza==='Extrajudicial'):(natureza&&c.natureza!==natureza))return false;
    if(!q)return true;
    return norm([c.nome,c.acao,c.processo,c.andamento,c.aFazer,c.parceiro].join(' ')).includes(q);
  });
  const key=filtro==='prazo'?'prazo':'verificar';
  arr.sort((a,b)=>(done(a)-done(b))||((a[key]||'9999')<(b[key]||'9999')?-1:(a[key]||'9999')>(b[key]||'9999')?1:0)||norm(a.nome).localeCompare(norm(b.nome)));
  const el=$('#list');
  if(!clientes.length){
    el.innerHTML='<div class="empty"><h2>Nenhum cliente por aqui ainda</h2><p>Importe o arquivo <b>clientes.json</b> ou cadastre o primeiro cliente.</p><div class="row"><button class="btn primary" data-m="import">Importar clientes.json</button><button class="btn" data-m="novo">+ Novo cliente</button></div></div>';
    return;
  }
  el.innerHTML=arr.length?arr.map(card).join(''):'<div class="empty"><h2>Tudo em dia</h2><p>Nenhum cliente encontrado neste filtro.</p></div>';
}

function render(){renderHeader();renderStats();renderList()}

/* Modal */
const dlg=$('#dlg'), form=$('#form');
function openForm(id){
  editId=id;
  const c=id?clientes.find(x=>x.id===id):{nome:'',acao:'',processo:'',natureza:'',parceria:'',parceiro:'',andamento:'',aFazer:'',ultimo:hoje(),verificar:addDays(hoje(),7),prazo:'',status:'Pendente'};
  $('#dlgTitle').textContent=id?'Editar cliente':'Novo cliente';
  $('#del').style.visibility=id?'visible':'hidden';
  for(const k of ['nome','acao','processo','natureza','parceria','parceiro','andamento','aFazer','ultimo','verificar','prazo','status']) form.elements[k].value=c[k]||'';
  if(!c.status) form.elements.status.value='Pendente';
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
  setTimeout(()=>form.elements[id?'aFazer':'nome'].focus(),50);
}
function closeForm(){if(dlg.close)dlg.close();else dlg.removeAttribute('open')}

form.addEventListener('submit',e=>{
  e.preventDefault();
  const v={};for(const k of ['nome','acao','processo','natureza','parceria','parceiro','andamento','aFazer','ultimo','verificar','prazo','status'])v[k]=form.elements[k].value.trim();
  if(!v.nome){toast('Informe o nome do cliente');return}
  if(editId){
    const c=clientes.find(x=>x.id===editId);
    if(v.andamento!==(c.andamento||'')&&v.ultimo===(c.ultimo||''))v.ultimo=hoje();
    Object.assign(c,v);
    toast('Alterações salvas');
  }else{
    clientes.push(Object.assign({id:uid()},v));
    toast('Cliente adicionado');
  }
  save();closeForm();render();
});
dlg.addEventListener('click',e=>{
  if(e.target===dlg||e.target.closest('[data-close]'))closeForm();
  const q=e.target.closest('[data-set]');
  if(q){form.elements[q.dataset.set].value=addDays(hoje(),+q.dataset.d)}
});
$('#del').addEventListener('click',()=>{
  const c=clientes.find(x=>x.id===editId);
  if(c&&confirm('Excluir "'+c.nome+'"? Essa ação não pode ser desfeita.')){
    clientes=clientes.filter(x=>x.id!==editId);save();closeForm();render();toast('Cliente excluído');
  }
});

/* Ações nos cards */
$('#list').addEventListener('click',e=>{
  const m=e.target.closest('[data-m]');if(m){menuAction(m.dataset.m);return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const id=b.closest('.card').dataset.id, c=clientes.find(x=>x.id===id);
  if(b.dataset.a==='editar')openForm(id);
  if(b.dataset.a==='concluir'){c.status=done(c)?'Pendente':'Concluído';save();render();toast(done(c)?'Marcado como concluído':'Reaberto')}
  if(b.dataset.a==='adiar'){const base=(c.verificar&&c.verificar>hoje())?c.verificar:hoje();c.verificar=addDays(base,7);save();render();toast('Verificação adiada para '+fmt(c.verificar))}
});
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){filtro=(filtro===f.dataset.f&&f.classList.contains('stat'))?'ativos':f.dataset.f;render()}
  if(!e.target.closest('#menu'))$('#menu').classList.remove('open');
});
$('#q').addEventListener('input',e=>{busca=e.target.value;renderList()});
$('#nat').addEventListener('change',e=>{natureza=e.target.value;renderList()});
$('#novo').addEventListener('click',()=>openForm(null));
$('#menuBtn').addEventListener('click',()=>$('#menu').classList.toggle('open'));
$('#menu .menu-list').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b){$('#menu').classList.remove('open');menuAction(b.dataset.m)}});

function menuAction(m){
  if(m==='novo')openForm(null);
  if(m==='print')window.print();
  if(m==='import')$('#file').click();
  if(m==='export'){
    const blob=new Blob([JSON.stringify(clientes,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rotina-backup-'+hoje()+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('Backup baixado');
  }
}
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      let data=JSON.parse(r.result);if(!Array.isArray(data))data=data.clientes;
      if(!Array.isArray(data))throw 0;
      if(clientes.length&&!confirm('Substituir os '+clientes.length+' clientes atuais pelos '+data.length+' do arquivo?'))return;
      clientes=data.map(c=>Object.assign({status:'Pendente'},c,{id:c.id||uid()}));
      save();filtro='ativos';render();toast(data.length+' clientes importados');
    }catch(err){toast('Arquivo inválido')}
    finally{e.target.value=''}
  };
  r.readAsText(f);
});

load();render();
})();
</script>
</body>
</html>
